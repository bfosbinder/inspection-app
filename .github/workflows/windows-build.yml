name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  win-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: py -m pip install --upgrade pip

      - name: Install deps
        run: |
          if (Test-Path requirements.txt) {
            py -m pip install -r requirements.txt
          } else {
            py -m pip install pyinstaller pyqt6 pymupdf opencv-python-headless pytesseract
          }

      - name: Build with PyInstaller (ONEDIR)
        run: >
          py -m PyInstaller --noconfirm --noconsole
          --name "InspectionApp"
          --collect-all PyQt6
          --collect-all fitz
          --collect-all cv2
          --collect-submodules pytesseract
          main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: InspectionApp-windows
          path: dist/**/*
